name: CI
permissions:
  contents: read

on:
  push:
    branches: [ main, 1.0.0 ]
  pull_request:
    branches: [ main, 1.0.0 ]
  merge_group:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pre-commit/action@v3.0.1

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install backend dependencies
      run: |
        cd backend
        pip install -r requirements.txt

    - name: Run backend unit tests
      run: |
        cd backend
        API_KEY=${{ secrets.API_KEY }} python -m pytest tests/test_molecule_generation.py -v

    - name: Run CLI validation tests
      run: |
        cd backend
        API_KEY=${{ secrets.API_KEY }} python -m pytest tests/test_cli_validation.py -v

    - name: Run backend e2e tests
      run: |
        cd backend
        python -m pytest tests/e2e/ -v

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        # Matches frontend/Dockerfile and e2e.yml. cypress 16 requires Node 22+.
        node-version: '22'

    - name: Clean node_modules
      run: rm -rf frontend/node_modules

    - name: Install frontend dependencies
      run: |
        cd frontend
        npm ci

    - name: Run frontend tests
      run: |
        cd frontend
        npx react-scripts test --watchAll=false --passWithNoTests

    - name: Install Docker Compose
      run: |
        curl -L "https://github.com/docker/compose/releases/download/1.29.2/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        chmod +x /usr/local/bin/docker-compose

    - name: Build Docker images
      run: docker-compose build
